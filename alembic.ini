# For writing new migrations with the alembic CLI, e.g.
#   alembic revision --autogenerate -m "add employee region"
# Applying them: `hrm db upgrade`. The database URL comes from settings (HRM_DATABASE_URL).
[alembic]
script_location = src/hrm/db/migrations
file_template = %%(rev)s_%%(slug)s

# Format every generated migration like the rest of the code.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
