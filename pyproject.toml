[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hrm-copilot"
version = "0.1.0"
description = "HR copilot: answers policy questions with cited RAG, then handles HR workflows with agents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Pinned exactly so every machine and CI run gets the same versions.
# Dependencies are added by the task that first needs them (RAG libs come in R3–R8).
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "typer==0.27.3",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-groq==1.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "types-pyyaml==6.0.12.20260906",
]

[project.scripts]
hrm = "hrm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hrm"]
