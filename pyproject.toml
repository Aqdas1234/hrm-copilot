[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hrm-copilot"
version = "0.1.0"
description = "HR copilot: answers policy questions with cited RAG, then handles HR workflows with agents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Pinned exactly so every machine and CI run gets the same versions.
# Dependencies are added by the task that first needs them (RAG libs come in R3–R8).
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "typer==0.27.3",
    "structlog==26.1.0",
    "pyyaml==6.0.3",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-groq==1.1.3",
    "tiktoken==0.14.0",
    "fastembed==0.9.0",
    "numpy==2.4.6",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
    "fastapi==0.156.8",
    "uvicorn==0.54.0",
    "streamlit==1.66.0",
]

# Dev tools as a dependency group (PEP 735): `uv sync` and `uv run` install it by default,
# so syncing the environment never removes them.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "types-pyyaml==6.0.12.20260906",
    "httpx==0.28.1",  # FastAPI TestClient
]

[project.scripts]
hrm = "hrm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hrm"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "UP",      # modern syntax for our Python version
    "B",       # likely bugs
    "SIM",     # simplifications
    "RUF",     # ruff-specific checks
    "T20",     # no print() in library code (use logging)
]

[tool.ruff.lint.per-file-ignores]
# Scripts in evals/ report results to the terminal, so print() is fine there.
"evals/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "evals"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summary of skips/failures; strict flags turn typos in markers/config into errors.
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
    "network: downloads or runs real models; skipped by default, run with: pytest -m network",
]
xfail_strict = true

[[tool.mypy.overrides]]
# rank-bm25 ships without type hints.
module = ["rank_bm25"]
ignore_missing_imports = true
